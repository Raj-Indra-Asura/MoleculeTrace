services:
  db:
    image: postgres:16
    container_name: moleculetrace-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-moleculetrace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      POSTGRES_DB: ${POSTGRES_DB:-moleculetrace}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./project/database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-moleculetrace} -d ${POSTGRES_DB:-moleculetrace}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional: a browser client for inspecting the schema.
  # Start it with:  docker compose --profile tools up -d adminer
  adminer:
    image: adminer:4
    container_name: moleculetrace-adminer
    profiles: ["tools"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  pgdata:
