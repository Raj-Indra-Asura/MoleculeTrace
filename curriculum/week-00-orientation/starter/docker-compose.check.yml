# Starter: minimal Compose file for the week-00 validation exercise.
#
# Goal: a one-service file that starts PostgreSQL 16, reads its credentials from
# .env, publishes a port and reports readiness with a healthcheck.
#
# Validate (from the repository root) with:
#   docker compose -f curriculum/week-00-orientation/starter/docker-compose.check.yml config
#
# Do NOT run "up" on this file while the main stack is running: it would clash
# on the same host port. Either stop the main stack first or use port 5433.

services:
  check-db:
    image: postgres:16
    environment:
      # TODO: set POSTGRES_USER, POSTGRES_PASSWORD and POSTGRES_DB from the
      #       .env variables, each with a default. Follow the pattern used in
      #       the root docker-compose.yml: ${VARIABLE:-default}
      POSTGRES_USER: TODO
    ports:
      # TODO: publish the container's 5432 on host port 5433 so it cannot clash
      #       with the main stack. Format is "host:container".
      - "TODO"
    healthcheck:
      # TODO: use pg_isready with the same user and database as above.
      test: ["CMD-SHELL", "TODO"]
      interval: 5s
      timeout: 5s
      retries: 10
